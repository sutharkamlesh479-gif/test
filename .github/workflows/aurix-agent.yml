name: AURIX Agent
on:
  push:
    paths:
      - 'AURIX-Agent/**'
      - '.github/workflows/aurix-agent.yml'
  pull_request:
    paths:
      - 'AURIX-Agent/**'
      - '.github/workflows/aurix-agent.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run unit tests
        working-directory: AURIX-Agent
        run: python -m unittest discover -s tests -v
      - name: Compile Python files
        working-directory: AURIX-Agent
        run: python -m compileall -q aurix_agent run_aurix.py
